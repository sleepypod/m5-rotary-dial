name: build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO and gcovr
        run: pip install platformio gcovr

      - name: Create credentials.h for build
        run: cp include/credentials.h.example include/credentials.h

      - name: Build firmware
        run: pio run

      - name: Static analysis (cppcheck)
        run: pio check --fail-on-defect=high --skip-packages
        continue-on-error: true

      - name: Unit tests (native, with coverage)
        run: pio test -e native

      - name: Coverage report (Cobertura)
        if: always()
        run: gcovr -r . --filter src/ --exclude-throw-branches --exclude-unreachable-branches --xml-pretty -o coverage.xml

      - name: Upload firmware artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/m5stack-dial/firmware.bin
          retention-days: 30

      # coverage.xml comes from the native Unity tests of src/dial_logic.cpp
      # (gcov via `--coverage`, filtered to src/ by gcovr above).
      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: sleepypod/m5-rotary-dial
          files: coverage.xml
          disable_search: true # only the gcovr report; skip the raw .gcov from libdeps
          fail_ci_if_error: false
